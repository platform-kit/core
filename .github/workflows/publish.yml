name: Publish PlatformKit packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version declared by both package manifests
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-platformkit-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          /* one package: the engine with its theme inside it */
          const pkg = JSON.parse(fs.readFileSync('packages/kit/package.json', 'utf8'))
          const version = process.env.RELEASE_VERSION
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version ?? '')) {
            throw new Error('Release version must be an exact semver version')
          }
          if (pkg.name !== 'platformkit') throw new Error(`packages/kit is ${pkg.name}; expected platformkit`)
          if (pkg.version !== version) throw new Error(`platformkit declares ${pkg.version}; expected ${version}`)
          NODE
      - name: Verify release
        run: npm test
      - name: Publish platformkit
        working-directory: packages/kit
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
