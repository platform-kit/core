# WHICH AGENTS GET THE PRERENDERED PAGE.
map $http_user_agent $is_crawler {
  default 0;
  "~*(googlebot|bingbot|duckduckbot|baiduspider|yandex(bot)?)"                 1;
  "~*(slackbot|discordbot|twitterbot|facebookexternalhit|linkedinbot)"         1;
  "~*(whatsapp|telegrambot|pinterest|redditbot|applebot|mastodon)"             1;
  "~*(embedly|quora link preview|showyoubot|outbrain|vkshare|skypeuripreview)" 1;
}


server {
  listen 80;
  server_name demo.platformkit.test;

  root /srv/sites/demo;
  index index.html;

  location ~* \.(js|css|woff2?|png|jpe?g|webp|svg|gif|ico|mp3|wasm)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  include /etc/nginx/conf.d/rewrites.demo.inc;
  include /etc/nginx/conf.d/prerender.inc;

  location @page {
    error_page 418 = @prerender;
    if ($is_crawler) { return 418; }
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/index.html @page; }
}

server {
  listen 80;
  server_name docs.platformkit.test;

  root /srv/sites/docs;
  index index.html;

  location ~* \.(js|css|woff2?|png|jpe?g|webp|svg|gif|ico|mp3|wasm)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  include /etc/nginx/conf.d/prerender.inc;

  location @page {
    error_page 418 = @prerender;
    if ($is_crawler) { return 418; }
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/index.html @page; }
}

server {
  listen 80;
  server_name sample.platformkit.test platformkit.test;

  root /srv/sites/sample;
  index index.html;

  location ~* \.(js|css|woff2?|png|jpe?g|webp|svg|gif|ico|mp3|wasm)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  include /etc/nginx/conf.d/rewrites.sample.inc;
  include /etc/nginx/conf.d/prerender.inc;

  location @page {
    error_page 418 = @prerender;
    if ($is_crawler) { return 418; }
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/index.html @page; }
}

server {
  listen 80;
  server_name www.platformkit.test;
  return 301 $scheme://sample.platformkit.test$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  return 404;
}
