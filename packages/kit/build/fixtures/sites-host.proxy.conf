# WHICH AGENTS GET THE PRERENDERED PAGE.
map $http_user_agent $is_crawler {
  default 0;
  "~*(googlebot|bingbot|duckduckbot|baiduspider|yandex(bot)?)"                 1;
  "~*(slackbot|discordbot|twitterbot|facebookexternalhit|linkedinbot)"         1;
  "~*(whatsapp|telegrambot|pinterest|redditbot|applebot|mastodon)"             1;
  "~*(embedly|quora link preview|showyoubot|outbrain|vkshare|skypeuripreview)" 1;
}


map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}


server {
  listen 80;
  server_name demo.platformkit.test;

  location / {
    proxy_pass http://host.docker.internal:5199;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  server_name docs.platformkit.test;

location / {
  default_type text/html;
  add_header Retry-After 5 always;
  return 503 "<!doctype html><html><head><title>docs is not running</title></head><body><h1>docs.platformkit.test is not running</h1><p>Run npm run dev in sites/docs.</p></body></html>";
}
}

server {
  listen 80;
  server_name sample.platformkit.test platformkit.test;

location / {
  default_type text/html;
  add_header Retry-After 5 always;
  return 503 "<!doctype html><html><head><title>sample is not running</title></head><body><h1>sample.platformkit.test is not running</h1><p>Run npm run dev in ..</p></body></html>";
}
}

server {
  listen 80;
  server_name www.platformkit.test;
  return 301 $scheme://sample.platformkit.test$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  return 404;
}
